name: Studio Local CI

on:
  pull_request:
    paths:
      - 'apps/studio-local/**'
      - 'packages/runtime-contracts/**'
      - '.github/workflows/studio-local-ci.yml'
  push:
    branches:
      - main
    tags:
      - 'studio-local-v*'
    paths:
      - 'apps/studio-local/**'
      - 'packages/runtime-contracts/**'
      - '.github/workflows/studio-local-ci.yml'

jobs:
  rust-test:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio-local/src-tauri
      - name: Verify Studio Local prerequisites and Rust tests
        run: npm --prefix apps/studio-local run test

  tagged-build:
    name: Tagged installer build (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/studio-local-v')
    needs: rust-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio-local/src-tauri
      - name: Build Studio Local bundle
        run: npm --prefix apps/studio-local run build
      - uses: actions/upload-artifact@v4
        with:
          name: studio-local-${{ matrix.os }}
          path: apps/studio-local/src-tauri/target/release/bundle/**
