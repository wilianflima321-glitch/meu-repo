<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aethel Studio Local</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: rgb(5 8 14);
        --panel: rgb(14 19 29);
        --border: rgb(43 54 74);
        --text: rgb(238 243 255);
        --muted: rgb(150 161 181);
        --accent: rgb(106 140 255);
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, rgb(18 28 54), var(--bg) 58%);
        color: var(--text);
      }

      main {
        width: min(720px, calc(100vw - 32px));
        border: 1px solid var(--border);
        border-radius: 22px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        padding: 28px;
        box-shadow: 0 24px 80px rgb(0 0 0 / 0.36);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
        letter-spacing: -0.04em;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .pill {
        display: inline-flex;
        margin-bottom: 18px;
        border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="pill">Studio Local Runtime</span>
      <h1>Aethel Studio Local is ready for native runtime wiring.</h1>
      <p>
        This offline shell is the safe fallback while the local app connects to the cloud Studio,
        native probe, job lanes, browser operator guard, and production evidence graph.
      </p>
    </main>
  </body>
</html>
