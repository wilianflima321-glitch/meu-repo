[package]
name = "aethel-studio-local"
version = "0.1.0"
edition = "2021"
description = "Aethel Studio Local native runtime kernel"

[lib]
name = "aethel_studio_local"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
notify = "6.1"
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
