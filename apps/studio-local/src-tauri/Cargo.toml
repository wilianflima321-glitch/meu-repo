[package]
name = "aethel-studio-local"
version = "0.1.0"
edition = "2021"
description = "Aethel Studio Local native runtime kernel"

[lib]
name = "aethel_studio_local"
path = "src/lib.rs"

[dependencies]
# Letter dc — unified WorldSoA / LBM / MutDNA kernel (path dep)
aethel-kernel-rust = { path = "../../../packages/aethel-kernel-rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
notify = "6.1"
wgpu = "0.19"
winit = "0.29"
pollster = "0.3"
rapier3d = "0.18"
# ONNX Runtime for local AI inference (optional — graceful fallback on init failure)
# crates.io has only 2.0.0-rc.* — pin RC so `cargo check` resolves (letter dc gate)
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"], optional = true }
# Secure direct HTTP for BYOK / sidecar downloads (no system proxy leakage)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
# Geometry clusterizer + SDF voxelizer (Sprint V33)
# letter dd — base64 was used (mmap/clusterizer/gi_sdf) but never declared;
# min_const_generics so Meshlet `[u8;384]` is Pod/Zeroable
base64 = "0.22"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
rfd = "0.14"

# --- Round 3 (Desktop Native Engine) additions -----------------------------
# Missão Suprema 2 (Profiler de Hardware Real): live CPU/RAM sampling.
# Missão Suprema 5 (ECS Multi-Threading Extremo): rayon-driven parallel ECS tick.
# Missão Suprema 4 (Memory-Mapped Files): zero-copy large-file streaming.
# Missão Suprema 3 (Asset Cooker): PNG/JPG decode ahead of native BC1 encode.
# Missão Suprema 7 (Live-Coding Determinístico): WASM gameplay hot-reload kernel.
#
# These are pinned as "*" (latest resolvable) rather than a specific minor
# version deliberately: this patch was authored without a working `cargo`
# toolchain to verify against (see the Round 3 report), so a hand-picked
# version number risks being either already yanked or not yet published by
# the time this is built. Pin these down to exact versions the first time
# `cargo build` actually runs against them.
# Fixed exact versions for production reliability (P3 / Desktop Engineering Rigor)
sysinfo = "0.30"
rayon = "1.10"
memmap2 = "0.9"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"] }
wasmtime = "18.0"

[features]
default = []
# Enable local ONNX inference when the hardware and runtime libraries are present
local-ai = ["ort"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.build-dependencies]
# tauri-build's WindowsResource::compile() only links the Common-Controls-v6
# manifest into `[[bin]]` targets (`rustc-link-arg-bins`); `cargo test`'s
# generated unit-test harness executable gets no manifest at all, so any
# GUI-touching transitive dep that needs a v6-only comctl32 export (e.g.
# `rfd`/`muda` calling `TaskDialogIndirect`) crashes the test binary at
# Windows PE-loader time with STATUS_ENTRYPOINT_NOT_FOUND — before any Rust
# code, including the test harness itself, ever runs. We re-embed the same
# manifest scoped to `--tests` (see build.rs) so the harness gets it too.
embed-resource = "3"
