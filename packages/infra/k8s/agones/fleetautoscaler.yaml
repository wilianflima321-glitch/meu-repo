# gating individual connection requests. That requires standing up a
# `FleetAutoscaleReview` webhook endpoint implementing Agones' request/
# response contract (`autoscaling.agones.dev/v1beta1`) — a reasonable Pilar
# 5 follow-up once real usage data from the Buffer policy above exists to
# tune it against.
