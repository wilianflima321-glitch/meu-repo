[package]
name = "aethel-kernel-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha256 = "1.5.0"
memmap2 = "0.9"
rayon = "1.12.0"
rapier3d = "0.17.2"
nalgebra = "0.32.3"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
bytes = "1.5"
wgpu = { version = "30.0.0", optional = true }
bytemuck = "1.25.2"

[features]
default = []
# Onda G wgpu bridge scaffolds — off by default so studio-local (wgpu 0.20) compiles without version clash.
wgpu-bridge = ["dep:wgpu"]
