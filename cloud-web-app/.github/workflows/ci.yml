name: Aethel Engine CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────
  # 1. Type Check
  # ─────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meu-repo/cloud-web-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meu-repo/cloud-web-app/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      - name: Type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────
  # 2. Unit Tests
  # ─────────────────────────────────────────────────────
  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meu-repo/cloud-web-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meu-repo/cloud-web-app/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      - name: Run tests
        run: npx vitest run --reporter=verbose --timeout=60000
        env:
          NODE_ENV: test

  # ─────────────────────────────────────────────────────
  # 3. Enterprise Quality Gate
  # ─────────────────────────────────────────────────────
  quality-gate:
    name: Enterprise Quality Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meu-repo/cloud-web-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meu-repo/cloud-web-app/web/package-lock.json
      - run: npm ci
      - name: Enterprise quality gate
        run: npm run qa:enterprise-gate

  # ─────────────────────────────────────────────────────
  # 4. Production Build
  # ─────────────────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    defaults:
      run:
        working-directory: meu-repo/cloud-web-app/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: meu-repo/cloud-web-app/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
          NEXTAUTH_SECRET: ci-secret-not-real
          NEXTAUTH_URL: 'http://localhost:3000'
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: meu-repo/cloud-web-app/web/.next
          retention-days: 3

  # ─────────────────────────────────────────────────────
  # 5. Docker Build Validation
  # ─────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build \
            --build-arg DATABASE_URL="postgresql://ci:ci@localhost/ci" \
            --build-arg NEXTAUTH_SECRET="ci-secret" \
            --build-arg NEXTAUTH_URL="http://localhost:3000" \
            -t aethel-engine:ci \
            -f meu-repo/cloud-web-app/Dockerfile \
            meu-repo/cloud-web-app/
