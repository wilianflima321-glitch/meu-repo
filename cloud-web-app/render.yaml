services:
  - type: web
    name: aethel-engine-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: ohio
    scaling:
      minInstances: 1
      maxInstances: 4
      targetMemoryPercent: 80
      targetCPUPercent: 70
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aethel-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aethel-redis
          type: redis
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
    healthCheckPath: /api/health
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: redis
    name: aethel-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  - name: aethel-postgres
    plan: standard
    databaseName: aethel_production
    user: aethel_user
