<svg width="512" height="512" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Aethel mark</title>
  <desc id="desc">A sharp AE ligature mark for the Aethel agent lattice and AI workforce platform.</desc>
  <defs>
    <linearGradient id="paper" x1="58" y1="42" x2="198" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.68" stop-color="#FAFAFA"/>
      <stop offset="1" stop-color="#B7B7BE"/>
    </linearGradient>
    <linearGradient id="rim" x1="34" y1="18" x2="218" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.64"/>
      <stop offset="0.38" stop-color="#A1A1AA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="shadow" x="30" y="26" width="202" height="208" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="236" height="236" rx="48" fill="#0A0A0A"/>
  <rect x="10.75" y="10.75" width="234.5" height="234.5" rx="47.25" stroke="url(#rim)" stroke-width="1.5"/>
  <g filter="url(#shadow)" aria-hidden="true">
    <text x="128" y="170" text-anchor="middle" fill="url(#paper)" font-family="Inter, Geist, Arial Black, Arial, sans-serif" font-size="146" font-weight="900" letter-spacing="-18">&#198;</text>
  </g>
  <path d="M71 182H185" stroke="#FAFAFA" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <circle cx="71" cy="182" r="3" fill="#FAFAFA" fill-opacity="0.64"/>
  <circle cx="128" cy="182" r="2.4" fill="#B7B7BE" fill-opacity="0.70"/>
  <circle cx="185" cy="182" r="3" fill="#FAFAFA" fill-opacity="0.64"/>
</svg>
